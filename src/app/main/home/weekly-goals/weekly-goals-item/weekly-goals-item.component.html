<div class="weekly-goals-item-container">
  <mat-checkbox 
    class="check-box"
    (change)="checkGoal()" 
    [checked]="goal()?.completed"
  ></mat-checkbox>
  <div class="item">
    <div class="goal-wrapper">
      <div class="goal" [class.completed]="goal()?.completed">{{ goal().text }}</div>
      <div class="hashtag" [style.color]="goal().hashtag.color">#{{ goal().hashtag.name }}</div>
    </div>
  </div>
</div>
